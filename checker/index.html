<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيّاد يوزرات ديسكورد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#14213d;--mut:#5d6b85;--line:#d8deea;--acc:#3a3adf;--accfg:#fff;--ok:#0e8a54;--okbg:#dff5ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162a;--card:#1a2240;--ink:#eef1fa;--mut:#9aa7c7;--line:#2d3860;--acc:#8c8cff;--accfg:#10162a;--ok:#5fe0a3;--okbg:#12382b}}
:root[data-theme="dark"]{--bg:#10162a;--card:#1a2240;--ink:#eef1fa;--mut:#9aa7c7;--line:#2d3860;--acc:#8c8cff;--accfg:#10162a;--ok:#5fe0a3;--okbg:#12382b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:34px;font-weight:800;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 22px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.lbl{font-weight:500;color:var(--mut);font-size:14px;margin:0 0 8px;display:block}
.pats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:18px}
.pat{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:12px 4px 8px;cursor:pointer;font-family:inherit;text-align:center}
.pat .ex{display:block;font-size:22px;font-weight:600}
.pat .nm{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.pat[aria-pressed="true"]{border-color:var(--acc);background:var(--acc)}
.pat[aria-pressed="true"] .ex,.pat[aria-pressed="true"] .nm{color:var(--accfg)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:130px}
select,input,textarea{width:100%;font-family:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{font-family:inherit;font-size:17px;font-weight:500;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;background:var(--acc);color:var(--accfg)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#status{color:var(--mut);font-size:15px;min-height:24px;margin-bottom:10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.it{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);cursor:pointer}
.it .mono{font-size:18px;font-weight:600}
.tag{font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.tag.no{background:var(--line);color:var(--mut)}
.tag.err{background:#fdeede;color:#b4561a}
.it.no .mono{color:var(--mut);font-weight:500}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut);margin-bottom:10px}
.chk input{width:auto}
.empty{color:var(--mut);text-align:center;padding:22px 8px;grid-column:1/-1}
textarea{resize:vertical}
details{font-size:14px;color:var(--mut)}
details summary{cursor:pointer;color:var(--ink);font-weight:500}
@media(max-width:520px){h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>صيّاد يوزرات ديسكورد</h1>
  <p class="sub">اختر النمط وعدد اليوزرات اللي تبيها، والموقع يولّد ويفحص لين يلقى لك المتاح.</p>

  <div class="panel">
    <span class="lbl">نوع اليوزر</span>
    <div class="pats" id="pats"></div>
    <div class="row">
      <div><label class="lbl" for="cs">الأحرف</label>
        <select id="cs"><option value="l">حروف فقط</option><option value="d">أرقام فقط</option><option value="m" selected>حروف وأرقام</option></select></div>
      <div><label class="lbl" for="sep">الفاصل (للشبه)</label>
        <select id="sep"><option value="any">أي فاصل</option><option value=".">نقطة .</option><option value="_">شرطة سفلية _</option></select></div>
      <div><label class="lbl" for="cnt">كم يوزر متاح تبي؟</label><input id="cnt" type="number" min="1" max="100" value="10"></div>
    </div>
    <div class="actions"><button class="btn" id="go">ابحث عن المتاح</button></div>
  </div>

  <div class="panel">
    <label class="lbl" for="own">أو افحص أسماء عندك (اسم في كل سطر، أو افصل بينها بمسافة أو فاصلة)</label>
    <textarea id="own" rows="4" class="mono" placeholder="9.7k&#10;ab_3&#10;nova"></textarea>
    <div class="actions"><button class="btn" id="go2">افحص قائمتي</button></div>
  </div>

  <div class="panel">
    <div class="bar"><i id="prog"></i></div>
    <div id="status"></div>
    <label class="chk"><input type="checkbox" id="onlyOk"> إظهار المتاح فقط</label>
    <div class="list" id="list"></div>
    <div class="actions"><button class="btn sec" id="copyAll">نسخ الكل</button></div>
  </div>

  <div class="panel">
    <details>
      <summary>إعدادات متقدمة</summary>
      <p>إذا فتحت الموقع من رابط السيرفر نفسه فلا تحتاج تغيّر شيئًا. غيّر الخانة فقط إذا كان سيرفر الفحص على رابط آخر.</p>
      <input id="api" class="mono" placeholder="/check">
    </details>
  </div>
</div>

<script>
const PATS=[
  {n:3,s:false,ex:"abc",nm:"ثلاثي"},
  {n:3,s:true,ex:"a.bc",nm:"شبه رباعي"},
  {n:4,s:false,ex:"abcd",nm:"رباعي"},
  {n:4,s:true,ex:"a.bcd",nm:"شبه خماسي"},
  {n:5,s:false,ex:"abcde",nm:"خماسي"},
  {n:6,s:false,ex:"abcdef",nm:"سداسي"},
  {n:5,s:true,ex:"a.bcde",nm:"شبه سداسي"}
];
const L="abcdefghijklmnopqrstuvwxyz".split(""),D="0123456789".split("");
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let pat=PATS[1],running=false,stop=false,found=[],rows=[],lastWhy="";
const WHY={rate_limited:"ديسكورد أوقف الطلبات مؤقتًا (حد الطلبات)",network:"الصفحة ما قدرت توصل للسيرفر",bad_response:"ديسكورد رجّع رد غير متوقع",bad_json:"طلب غير صالح"};
function why(c){return WHY[c]||(/^http_/.test(c)?"ديسكورد رفض الطلب ("+c.replace("http_","")+")":c);}

function renderPats(){
  $("pats").innerHTML="";
  PATS.forEach(p=>{
    const b=document.createElement("button");
    b.className="pat";b.setAttribute("aria-pressed",p===pat);
    b.innerHTML='<span class="ex mono">'+p.ex+'</span><span class="nm">'+p.nm+'</span>';
    b.onclick=()=>{if(running)return;pat=p;renderPats();};
    $("pats").appendChild(b);
  });
}
function makeName(){
  const cs=$("cs").value,sc=$("sep").value;
  const pool=cs==="l"?L:cs==="d"?D:L.concat(D);
  const ch=[];for(let i=0;i<pat.n;i++)ch.push(rnd(pool));
  if(pat.s){
    const sep=sc==="any"?rnd([".","_"]):sc;
    ch.splice(1+Math.floor(Math.random()*(pat.n-1)),0,sep);
  }
  return ch.join("");
}
function api(){return $("api").value.trim()||"/check";}

// فحص يوزر واحد مع إعادة محاولة صامتة
async function checkOne(u){
  for(let t=0;t<4;t++){
    try{
      const res=await fetch(api(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u})});
      const j=await res.json();
      if(j.available===true)return "ok";
      if(j.available===false)return "taken";
      lastWhy=why(j.error||"bad_response");
    }catch(e){lastWhy=why("network");}
    if(stop)return "skip";
    await sleep(1000*(t+1));
  }
  return "fail";
}
function render(){
  const el=$("list");el.innerHTML="";
  const only=$("onlyOk").checked;
  const list=(only?rows.filter(r=>r.st==="ok"):rows).slice(-200).reverse();
  if(!list.length){el.innerHTML='<div class="empty">'+(rows.length?"لا يوجد متاح بعد.":"النتائج تظهر هنا.")+'</div>';return;}
  const LAB={busy:["جارٍ الفحص…","no"],ok:["متاح","" ],taken:["غير متاح","no"],fail:["تعذّر الفحص","err"],skip:["أُوقف","no"]};
  list.forEach(r=>{
    const l=LAB[r.st];
    const d=document.createElement("div");d.className="it"+(r.st==="ok"?"":" no");
    if(r.st==="ok"){d.title="اضغط للنسخ";d.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(r.u).catch(()=>{});}
    d.innerHTML='<span class="mono">'+r.u+'</span><span class="tag '+l[1]+'">'+l[0]+'</span>';
    el.appendChild(d);
  });
}
const CONC=4; // عدد الفحوصات المتزامنة
function rate(st){const s=(Date.now()-st.t0)/1000;return s>2?" · السرعة "+(st.checked/s).toFixed(1)+" اسم/ث":"";}
async function worker(next,st,done){
  while(!stop&&!st.end){
    const u=next();if(u===null)break;
    const row={u,st:"busy"};rows.push(row);render();
    const r=await checkOne(u);
    row.st=r==="ok"?"ok":r==="taken"?"taken":r==="skip"?"skip":"fail";
    if(r==="ok"){found.push(u);st.fails=0;}
    else if(r==="taken")st.fails=0;
    else if(r==="fail"&&++st.fails>=3)st.end="fail";
    st.checked++;
    $("status").textContent="جارٍ الفحص… فُحص "+st.checked+" · متاح "+found.length+(st.want?" من "+st.want:"")+rate(st);
    $("prog").style.width=Math.min(100,Math.round((st.total?st.checked/st.total:found.length/st.want)*100))+"%";
    render();
    if(done())break;
  }
}
function startUI(){running=true;stop=false;found=[];rows=[];render();$("go").disabled=$("go2").disabled=false;}
function endUI(){running=false;stop=false;$("go").textContent="ابحث عن المتاح";$("go2").textContent="افحص قائمتي";$("go").disabled=$("go2").disabled=false;}
async function search(){
  if(running){stop=true;return;}
  startUI();$("go").textContent="إيقاف";$("go2").disabled=true;
  const want=Math.max(1,Math.min(100,+$("cnt").value||10)),max=want*150;
  const seen=new Set();
  const st={checked:0,fails:0,end:"",issued:0,dups:0,t0:Date.now(),want};
  const next=()=>{
    if(st.issued>=max)return null;
    while(true){
      const u=makeName();
      if(!seen.has(u)){seen.add(u);st.issued++;return u;}
      if(++st.dups>300){st.end=st.end||"dups";return null;}
    }
  };
  await Promise.all(Array.from({length:CONC},()=>worker(next,st,()=>found.length>=want)));
  $("prog").style.width=Math.min(100,Math.round(found.length/want*100))+"%";
  let msg="";
  if(found.length>=want)msg="تم! لقيت "+found.length+" يوزر متاح بعد فحص "+st.checked+".";
  else if(stop)msg="تم الإيقاف. وُجد "+found.length+" بعد فحص "+st.checked+".";
  else if(st.end==="fail")msg="ما قدرت أفحص. السبب: "+(lastWhy||"غير معروف")+". انتظر دقيقة ثم اضغط «ابحث» مرة ثانية.";
  else if(st.end==="dups")msg="ما بقي أسماء جديدة بهذا النمط. وُجد "+found.length+".";
  else msg="فحصت "+st.checked+" اسم ولقيت "+found.length+" فقط. هذا النمط شبه محجوز كله. جرّب سداسي أو شبه سداسي، فرصهم أكبر بكثير.";
  $("status").textContent=msg;
  endUI();
}
async function checkList(){
  if(running){stop=true;return;}
  const names=[...new Set($("own").value.toLowerCase().split(/[\s,،;]+/).filter(Boolean))].filter(u=>/^(?!.*\.\.)[a-z0-9_.]{2,32}$/.test(u));
  if(!names.length){$("status").textContent="اكتب أسماء صالحة: حروف إنجليزية صغيرة وأرقام و _ و . فقط، من 2 إلى 32 خانة.";return;}
  startUI();$("go2").textContent="إيقاف";$("go").disabled=true;
  let i=0;
  const st={checked:0,fails:0,end:"",t0:Date.now(),total:names.length};
  await Promise.all(Array.from({length:CONC},()=>worker(()=>i<names.length?names[i++]:null,st,()=>false)));
  $("prog").style.width=Math.min(100,Math.round(st.checked/names.length*100))+"%";
  $("status").textContent=st.end==="fail"?"ما قدرت أفحص. السبب: "+(lastWhy||"غير معروف")+". انتظر دقيقة وحاول من جديد."
    :stop?"تم الإيقاف. وُجد "+found.length+" بعد فحص "+st.checked+"."
    :"انتهى الفحص: "+found.length+" متاح من "+names.length+".";
  endUI();
}
$("go").onclick=search;
$("go2").onclick=checkList;
$("onlyOk").onchange=render;
$("copyAll").onclick=()=>{
  if(found.length&&navigator.clipboard)navigator.clipboard.writeText(found.join("\n")).then(()=>{$("status").textContent="تم نسخ "+found.length+" يوزر.";}).catch(()=>{});
};
renderPats();render();
</script>
</body>
</html>
